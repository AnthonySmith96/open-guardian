[package]
name = "open-guardian"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Anthony Smith"]
description = "Local egress data-protection proxy for AI agents: secrets and PII never leave your machine."
repository = "https://github.com/AnthonySmith96/open-guardian"
keywords = ["ai", "security", "dlp", "llm", "proxy"]
categories = ["network-programming"]

[features]
default = ["native-keyring", "portable-vault"]
native-keyring = ["dep:keyring", "dep:rpassword"]
portable-vault = ["dep:age", "zeroize/serde"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
rand = "0.8"
colored = "2.0"
anyhow = "1.0"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http = "1.0"
async-trait = "0.1"
toml = "0.8"
service-manager = "0.10"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
zeroize = "1.9"
keyring = { version = "=4.1.5", optional = true, default-features = false, features = ["v1"] }
rpassword = { version = "=7.5.4", optional = true }
age = { version = "=0.12.1", optional = true, default-features = false }

# Rule file integrity (HMAC manifests)
hmac-sha256 = "1.1"
sha2 = "0.10"
hex = "0.4"

# Evasion-resistant normalization for DLP detection
unicode-normalization = "0.1"
html-escape = "0.2"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util", "macros", "rt-multi-thread"] }
