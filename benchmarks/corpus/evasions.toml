# JSON-level unicode escapes are resolved by the parser BEFORE extraction,
# so this is NOT an evasion — the plain key must simply be redacted.
[[case]]
id = "evasion-json-unicode-escape-resolved"
category = "evasion"
expect = "redact"
secret = "sk-proj-4Wq7mZxKp2RtYb8Vc5Nf3Jh6Ld9sQw"
body = "{\"model\":\"gpt-4o-mini\",\"input\":\"deploy with \\u0073k-proj-4Wq7mZxKp2RtYb8Vc5Nf3Jh6Ld9sQw today\"}"

[[case]]
id = "evasion-split-across-fields"
category = "evasion"
expect = "redact"
known_gap = true
secret = "gsk_Qw3Er5"
note = "No detector joins key fragments split across different parts of the payload; the model can reassemble them upstream."
body = '''{"model":"llama-3.3-70b","messages":[{"role":"user","content":"inference on gsk_Qw3Er5 works"},{"role":"assistant","content":"and the rest is Ty7Ui9Op1As3DfGh"}]}'''

[[case]]
