# ============================================================
# OPEN-GUARDIAN SECRET DETECTION RULES (v0.3)
# ============================================================
# Format: gitleaks-compatible rule set. Fields supported by the
# DLP engine: id, description, regex, secretGroup, entropy,
# keywords. Unknown fields are ignored, so the upstream
# gitleaks.toml (https://github.com/gitleaks/gitleaks, MIT)
# can be dropped in as a replacement for this file.
#
# Matching semantics:
#   - regex      : Rust `regex` crate (RE2 syntax, like Go's).
#   - keywords   : optional prefilter; at least one keyword must
#                  appear in the scanned text (case-insensitive).
#   - entropy    : optional minimum Shannon entropy (bits/char)
#                  required on the matched secret.
#   - secretGroup: 1-based capture group treated as the secret;
#                  only that group is redacted.
# ============================================================

[[rules]]
id = "OPENAI-API-KEY"
description = "OpenAI API key"
regex = '''\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-"]

[[rules]]
id = "ANTHROPIC-API-KEY"
description = "Anthropic API key"
regex = '''\bsk-ant-(?:api|admin)[A-Za-z0-9_-]{24,}\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "OPENROUTER-API-KEY"
description = "OpenRouter API key"
regex = '''\bsk-or-(?:v1-)?[A-Za-z0-9]{40,}\b'''
keywords = ["sk-or-"]

[[rules]]
id = "XAI-API-KEY"
description = "xAI (Grok) API key"
regex = '''\bxai-[A-Za-z0-9]{40,}\b'''
keywords = ["xai-"]

[[rules]]
id = "GROQ-API-KEY"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{20,}\b'''
keywords = ["gsk_"]

[[rules]]
id = "GOOGLE-API-KEY"
description = "Google API key (AIza...)"
regex = '''\bAIza[0-9A-Za-z_-]{35}\b'''
keywords = ["aiza"]

[[rules]]
id = "AWS-ACCESS-TOKEN"
description = "AWS access key id"
regex = '''\b(?:AKIA|ASIA|ABIA|ACCA|A3T)[A-Z0-9]{16}\b'''
keywords = ["akia", "asia", "abia", "acca", "a3t"]

[[rules]]
id = "AWS-SECRET-ASSIGNMENT"
description = "aws_secret_access_key assignment"
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key\s*[:=]\s*["']?([A-Za-z0-9/+=]{30,})["']?'''
secretGroup = 1
entropy = 3.5
keywords = ["aws_secret_access_key", "aws-secret-access-key"]

[[rules]]
id = "GITHUB-TOKEN"
description = "GitHub personal access token"
regex = '''\bgh[pousr]_[A-Za-z0-9]{36,255}\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "GITLAB-TOKEN"
description = "GitLab personal access token"
regex = '''\bglpat-[A-Za-z0-9_-]{20,}\b'''
keywords = ["glpat-"]

[[rules]]
id = "SLACK-TOKEN"
description = "Slack token"
regex = '''\bxox[abposr]-[A-Za-z0-9-]{10,}\b'''
keywords = ["xoxa-", "xoxb-", "xoxo-", "xoxp-", "xoxs-", "xoxr-"]

[[rules]]
id = "SLACK-WEBHOOK"
description = "Slack incoming webhook URL"
regex = '''https://hooks\.slack\.com/services/T[A-Za-z0-9_]+/B[A-Za-z0-9_]+/[A-Za-z0-9]+'''
keywords = ["hooks.slack.com"]

[[rules]]
id = "DISCORD-WEBHOOK"
description = "Discord webhook URL"
regex = '''https://(?:canary\.|ptb\.)?discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+'''
keywords = ["discord.com/api/webhooks", "discordapp.com/api/webhooks"]

[[rules]]
id = "STRIPE-KEY"
description = "Stripe secret or restricted key"
regex = '''\b[sr]k_(?:live|test)_[A-Za-z0-9]{20,}\b'''
keywords = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]

[[rules]]
id = "TELEGRAM-BOT-TOKEN"
description = "Telegram bot token"
regex = '''\b[0-9]{8,10}:AA[A-Za-z0-9_-]{33}\b'''
keywords = [":aa"]

[[rules]]
id = "SENDGRID-API-KEY"
description = "SendGrid API key"
regex = '''\bSG\.[A-Za-z0-9_-]{16,32}\.[A-Za-z0-9_-]{16,64}\b'''
keywords = ["sg."]

[[rules]]
id = "MAILGUN-API-KEY"
description = "Mailgun API key"
regex = '''\bkey-[a-f0-9]{32}\b'''
keywords = ["mailgun"]

[[rules]]
id = "NPM-TOKEN"
description = "npm access token"
regex = '''\bnpm_[A-Za-z0-9]{36}\b'''
keywords = ["npm_"]

[[rules]]
id = "PYPI-TOKEN"
description = "PyPI upload token"
regex = '''\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}\b'''
keywords = ["pypi-ageichlwas5vcmc"]

[[rules]]
id = "HUGGINGFACE-TOKEN"
description = "Hugging Face access token"
regex = '''\bhf_[A-Za-z0-9]{30,}\b'''
keywords = ["hf_"]

[[rules]]
id = "SHOPIFY-TOKEN"
description = "Shopify access token"
regex = '''\bshp(?:at|ca|pa|ss)_[a-fA-F0-9]{32}\b'''
keywords = ["shpat_", "shpca_", "shppa_", "shpss_"]

[[rules]]
id = "TWILIO-API-KEY"
description = "Twilio API key"
regex = '''\bSK[0-9a-fA-F]{32}\b'''
keywords = ["twilio"]

[[rules]]
id = "JWT"
description = "JSON Web Token"
regex = '''\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'''
keywords = ["eyj"]

[[rules]]
id = "PRIVATE-KEY-BLOCK"
description = "PEM private key block"
regex = '''(?s)-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----.{0,8000}?-----END (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["private key-----"]

[[rules]]
id = "DB-URL-CREDENTIALS"
description = "Database URL with embedded credentials"
regex = '''\b(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis|rediss|amqp)://[^:\s/"']+:[^@\s/"']+@[A-Za-z0-9._%-]+(?:/[^\s"']*)?'''
keywords = ["postgres://", "postgresql://", "mysql://", "mongodb://", "mongodb+srv://", "redis://", "rediss://", "amqp://"]

[[rules]]
id = "GENERIC-SECRET-ASSIGNMENT"
description = "Generic high-entropy secret assignment"
regex = '''(?i)\b(?:api[_-]?key|apikey|secret|token|password|passwd|pwd|auth[_-]?token|access[_-]?token|client[_-]?secret|private[_-]?key)\b\s*[:=]\s*["']?([A-Za-z0-9+/_\-.=]{16,})["']?'''
secretGroup = 1
entropy = 3.5
keywords = ["key", "secret", "token", "password", "passwd", "pwd"]

[[rules]]
id = "BEARER-TOKEN"
description = "Bearer token in text"
regex = '''\bBearer\s+[A-Za-z0-9_\-.=+/]{20,}\b'''
keywords = ["bearer"]
