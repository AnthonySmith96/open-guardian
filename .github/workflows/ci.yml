name: Open-Guardian CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Reject RustSec vulnerabilities and warnings
        # age 0.12.1 is the latest release; this is an unmaintained build-time
        # proc-macro warning, not a runtime vulnerability. See SECURITY.md.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0173

  quality:
    name: Format, lint, and feature gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint every target and feature
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Verify headless build
        run: cargo check --all-targets --no-default-features --locked

      - name: Benchmark regression gate
        run: cargo run --locked --quiet -- bench --gate

      - name: Benchmark document freshness
        run: |
          cargo run --locked --quiet -- bench --docs target/BENCHMARK.fresh.md
          diff -u docs/BENCHMARK.md target/BENCHMARK.fresh.md

  gitleaks-compat:
    name: Upstream gitleaks.toml drop-in check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Drop-in compatibility means: the official file loads, compiles, and
      # the pipeline runs. Detection rates are reported in the uploaded
      # artifact, not gated — our curated ruleset exists precisely because
      # upstream file-scanning rules underperform on proxy traffic.
      - name: Fetch pinned upstream gitleaks.toml
        run: |
          curl -fsSL -o gitleaks.toml https://raw.githubusercontent.com/gitleaks/gitleaks/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b/config/gitleaks.toml
          sha256sum gitleaks.toml

      - name: Run benchmark with upstream rules
        run: cargo run --locked --quiet -- bench --rules gitleaks.toml --json target/gitleaks-report.json

      - name: Upload compatibility report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-compat-report
          path: target/gitleaks-report.json

  compatibility:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run all tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked
