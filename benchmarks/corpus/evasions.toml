# Evasion corpus: attempts to sneak the same Groq key past detection.
# Encoded/obfuscated variants must be REJECTED fail-closed (block), because a
# value that only surfaces after normalization cannot be rewritten in place.
# The two fragmentation cases are honest known gaps: fragments are reported,
# never gated.

[[case]]
id = "evasion-percent-encoded"
category = "evasion"
expect = "block"
secret = "gsk_Qw3%45r5Ty7Ui9Op1As3DfGh"
body = '''{"model":"llama-3.3-70b","messages":[{"role":"user","content":"inference on gsk_Qw3%45r5Ty7Ui9Op1As3DfGh is cheapest"}]}'''

[[case]]
id = "evasion-percent-double-encoded"
category = "evasion"
expect = "block"
secret = "gsk_Qw3%2545r5Ty7Ui9Op1As3DfGh"
body = '''{"model":"llama-3.3-70b","messages":[{"role":"user","content":"inference on gsk_Qw3%2545r5Ty7Ui9Op1As3DfGh is cheapest"}]}'''

