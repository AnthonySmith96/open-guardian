name: Open-Guardian CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Reject RustSec vulnerabilities and warnings
        # age 0.12.1 is the latest release; this is an unmaintained build-time
        # proc-macro warning, not a runtime vulnerability. See SECURITY.md.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0173

  quality:
    name: Format, lint, and feature gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint every target and feature
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Verify headless build
        run: cargo check --all-targets --no-default-features --locked

  compatibility:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run all tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked
