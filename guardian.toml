# ==========================================
# OPEN-GUARDIAN CONFIGURATION
# "Secure by Default, Configurable by Choice."
# Open-Guardian v0.3.0 local-first profile
# ==========================================

[server]
# Loopback-only by default. Set to "0.0.0.0" only when network exposure is intentional.
bind_address = "127.0.0.1"
port = 8080
# Privacy default: unmatched models remain on the local Ollama-compatible endpoint.
default_upstream = "http://127.0.0.1:11434/v1"

# Per-client-IP request budget (token bucket, burstable).
# Default: 1200/min per IP. 0 disables the limiter.
requests_per_minute = 1200

[security]
# Path for security event logs (JSONL format)
audit_log_path = "guardian_audit.jsonl"

# ==========================================
# DLP (Data Loss Prevention)
# ==========================================
[security.dlp]
# "redact" -> replace secrets/PII with reversible request-scoped
#             placeholders and restore them locally in the response
# "block"  -> reject any request that contains them
action = "redact"

# Reject content whose sensitive data only appears after decoding
# (percent-encoding, HTML entities, ...). Such values cannot be
# safely rewritten in place, so the safe default is to reject.
block_on_obfuscated = true

# gitleaks-compatible TOML rule files for secret detection.
# The official gitleaks.toml can be dropped in as a replacement.
rules_files = ["rules/secrets.toml"]

# Per-category PII toggles (all on by default)
email_redaction = true
credit_card_redaction = true
secret_redaction = true
ssn_redaction = true
ip_redaction = true
phone_redaction = true

# ==========================================
# MODEL ROUTING & CREDENTIAL INJECTION
# ==========================================

[routes]
# --- GROQ ---
"gpt-oss" = { url = "https://api.groq.com/openai", model = "openai/gpt-oss-120b", credential = "{{secret:env://GROQ_API_KEY}}" }

"llama-4" = { url = "https://api.groq.com/openai", model = "meta-llama/llama-4-maverick-17b-128e-instruct", credential = "{{secret:env://GROQ_API_KEY}}" }

"llama-3-fast" = { url = "https://api.groq.com/openai", model = "llama-3.1-8b-instant", credential = "{{secret:env://GROQ_API_KEY}}" }

"qwen-32b" = { url = "https://api.groq.com/openai", model = "qwen/qwen3-32b", credential = "{{secret:env://GROQ_API_KEY}}" }

# --- OpenAI ---
"gpt-4o" = { url = "https://api.openai.com/v1", credential = "{{secret:env://OPENAI_API_KEY}}" }

# --- Local ---
"qwen3:4b" = { url = "http://127.0.0.1:11434/v1" }
"qwen2.5:0.5b" = { url = "http://127.0.0.1:11434/v1" }

# ==========================================
# SEMANTIC LOAD BALANCER
# Cost-optimized routing based on prompt complexity.
# Prompts scoring >= smart_threshold go to the "smart" tier.
# Prompts scoring < smart_threshold go to the "fast" tier.
# ==========================================
[load_balancer]
# Explicit opt-in: enabling this example sends matching prompts to external providers.
enabled = false
smart_threshold = 40

# "Economy" line: cheap + fast (ideal for simple queries)
[load_balancer.fast]
url = "https://api.groq.com/openai"
model = "llama3-8b-8192"
credential = "{{secret:env://GROQ_API_KEY}}"

# "Premium" line: high-intelligence (ideal for complex reasoning)
[load_balancer.smart]
url = "https://api.openai.com/v1"
model = "gpt-4-turbo"
credential = "{{secret:env://OPENAI_API_KEY}}"
