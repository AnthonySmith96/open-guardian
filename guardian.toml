# ==========================================
# OPEN-GUARDIAN CONFIGURATION
# "Secure by Default, Configurable by Choice."
# Open-Guardian v0.1.4
# ==========================================

[server]
# Loopback-only by default. Set to "0.0.0.0" only when network exposure is intentional.
bind_address = "127.0.0.1"
port = 8080
# Default upstream for requests that don't match a specific route
default_upstream = "https://api.groq.com/openai"

# RATE LIMITING (Cost & Resource Protection)
# Maximum global requests per minute
requests_per_minute = 10000

[security]
# FORENSIC AUDITING
# Path for security event logs (JSONL format)
audit_log_path = "guardian_audit.jsonl"
# Sensitivity threshold for blocking heuristic attacks (0-100)
block_threshold = 50

# ==========================================
# DLP (Data Loss Prevention) Toggles
# Per-category switches for PII/Secret redaction.
# All enabled by default. Set to false to disable.
# ==========================================
[security.dlp]
email_redaction = true
credit_card_redaction = true
secret_redaction = true
ssn_redaction = true
ip_redaction = true
phone_redaction = true

# ==========================================
# POLICY MANAGER (The Governor)
# ==========================================
[security.policies]
# Default action when a threat is detected: block, audit, redact, allow
# "block"  -> Return 403, stop the request
# "audit"  -> Log WARN + inject X-Guardian-Risk header + forward
# "redact" -> Sanitize and forward
# "allow"  -> No enforcement (not recommended)
default_action = "block"

# DLP behavior: "block" (stop request) or "redact" (replace with <TOKEN> anonymizers)
dlp_action = "redact"

# Modular threat dictionaries (replaces old threats_path)
# Add new languages/categories by adding a new [[security.dictionaries]] entry.
# Set enabled = false to disable a dictionary without deleting it.

[[security.dictionaries]]
id = "common"
path = "rules/common.json"
enabled = true

[[security.dictionaries]]
id = "jailbreaks_en"
path = "rules/jailbreaks_en.json"
enabled = true

[[security.dictionaries]]
id = "jailbreaks_es"
path = "rules/jailbreaks_es.json"
enabled = true

# DevOps Mode (Whitelisting): Explicitly allow dangerous patterns
# These bypass the Threat Engine signature check
allowed_patterns = ["git pull", "git push", "kubectl get", "kubectl apply"]

# ==========================================
# THE SHERIFF (Local AI Governance Judge)
# Optional: Set ai_judge_enabled = false to run in "Heuristics Only" mode (faster, less Contextual)
# Model: Defaults to "qwen2.5:0.5b" but supports ANY model pulled in Ollama (e.g. "llama3", "mistral")
# ==========================================
[judge]
ai_judge_enabled = true
ai_judge_endpoint = "http://127.0.0.1:11434/api/chat"
# You can use any model name from `ollama list` here:
ai_judge_model = "qwen2.5:0.5b"

# PERFORMANCE TUNING
# Cache TTL: Avoid redundant inference for identical prompts (Seconds)
judge_cache_ttl_seconds = 60

# Concurrency: Max simultaneous evaluations to protect host resources
judge_max_concurrency = 4

# RESILIENCE MODE:
# true = Fail-Open (Prioritize Availability). Recommended for DevOps Agents.
# false = Fail-Close (Prioritize Security). Recommended for Enterprise.
fail_open = true

# ==========================================
# SMART ROUTING & CREDENTIAL INJECTION
# ==========================================

[routes]
# --- GROQ ---
"gpt-oss" = { url = "https://api.groq.com/openai", model = "openai/gpt-oss-120b", key_env = "GROQ_API_KEY" }

"llama-4" = { url = "https://api.groq.com/openai", model = "meta-llama/llama-4-maverick-17b-128e-instruct", key_env = "GROQ_API_KEY" }

"llama-3-fast" = { url = "https://api.groq.com/openai", model = "llama-3.1-8b-instant", key_env = "GROQ_API_KEY" }

"qwen-32b" = { url = "https://api.groq.com/openai", model = "qwen/qwen3-32b", key_env = "GROQ_API_KEY" }

# --- OpenAI ---
"gpt-4o" = { url = "https://api.openai.com/v1", key_env = "OPENAI_API_KEY" }

# --- Local ---
"qwen3:4b" = { url = "http://127.0.0.1:11434/v1" }
"qwen2.5:0.5b" = { url = "http://127.0.0.1:11434/v1" }

# ==========================================
# SEMANTIC LOAD BALANCER
# Cost-optimized routing based on prompt complexity.
# Prompts scoring >= smart_threshold go to the "smart" tier.
# Prompts scoring < smart_threshold go to the "fast" tier.
# ==========================================
[load_balancer]
enabled = true
smart_threshold = 40

# "Economy" line: cheap + fast (ideal for simple queries)
[load_balancer.fast]
url = "https://api.groq.com/openai"
model = "llama3-8b-8192"
key_env = "GROQ_API_KEY"

# "Premium" line: high-intelligence (ideal for complex reasoning)
[load_balancer.smart]
url = "https://api.openai.com/v1"
model = "gpt-4-turbo"
key_env = "OPENAI_API_KEY"
